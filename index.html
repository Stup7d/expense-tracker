<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

    <h1>My Expense Tracker</h1>

    <p class="subtitle">Track your daily expenses.</p>

    <label>Expense name:</label>
    <input type="text" id="expenseName" placeholder="e.g. Lunch">

    <br><br>

    <label>Amount:</label>
    <input type="number" id="expenseAmount" placeholder="e.g. 150">
        <label>Category:</label>
<select id="expenseCategory">
    <option value="Food">Food</option>
    <option value="Travel">Travel</option>
    <option value="Shopping">Shopping</option>
    <option value="Bills">Bills</option>
    <option value="Other">Other</option>
</select>
        <label>Date:</label>
<input type="date" id="expenseDate">

    <br><br>

    <button onclick="addExpense()">Add Expense</button>

    <h2>Expenses</h2>

    <ul id="expenseList"></ul>

    <h2 class="total">Total: ₹<span id="total">0</span></h2>
        <h2>Spending Summary</h2>

    <ul id="summaryList"></ul>

    <script>
        let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

function displayExpenses() {

    let list = document.getElementById("expenseList");
    list.innerHTML = "";

    let total = 0;
    let categoryTotals = {
    Food: 0,
    Travel: 0,
    Shopping: 0,
    Bills: 0,
    Other: 0
};

    expenses.forEach(function(expense, index) {

        total = total + expense.amount;

        categoryTotals[expense.category] =
            
        categoryTotals[expense.category] + expense.amount;

        let item = document.createElement("li");

        item.innerHTML = `
            <strong>${expense.name}</strong><br>
            ₹${expense.amount} • ${expense.category}<br>
    📅 ${expense.date}
            <button onclick="deleteExpense(${index})">
                Delete
            </button>
        `;

        list.appendChild(item);
    });

    document.getElementById("total").textContent = total;

let summaryList = document.getElementById("summaryList");

summaryList.innerHTML = "";

for (let category in categoryTotals) {

    let item = document.createElement("li");

    item.textContent =
        category + ": ₹" + categoryTotals[category];

    summaryList.appendChild(item);
}
}

function addExpense() {

    let name = document.getElementById("expenseName").value;

    let amount = Number(
        document.getElementById("expenseAmount").value
    );

    let category =
        document.getElementById("expenseCategory").value;
    
    let date =
    document.getElementById("expenseDate").value;

    if (name === "" || amount <= 0) {
        alert("Please enter a valid expense.");
        return;
    }

    let expense = {
        name: name,
        amount: amount,
        category: category'
        date: date
    };

    expenses.push(expense);

    localStorage.setItem(
        "expenses",
        JSON.stringify(expenses)
    );

    document.getElementById("expenseName").value = "";
    document.getElementById("expenseAmount").value = "";
    document.getElementById("expenseDate").value = "";

    displayExpenses();
}

function deleteExpense(index) {

    expenses.splice(index, 1);

    localStorage.setItem(
        "expenses",
        JSON.stringify(expenses)
    );

    displayExpenses();
}

displayExpenses();
    </script>

    </div>
</body>
</html>
