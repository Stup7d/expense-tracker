<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

    <h1>My Expense Tracker</h1>

    <p class="subtitle">Track your daily expenses.</p>

    <label>Expense name:</label>
    <input type="text" id="expenseName" placeholder="e.g. Lunch">

    <br><br>

    <label>Amount:</label>
    <input type="number" id="expenseAmount" placeholder="e.g. 150">
        <label>Category:</label>
<select id="expenseCategory">
    <option value="Food">Food</option>
    <option value="Travel">Travel</option>
    <option value="Shopping">Shopping</option>
    <option value="Bills">Bills</option>
    <option value="Other">Other</option>
</select>

    <br><br>

    <button onclick="addExpense()">Add Expense</button>

    <h2>Expenses</h2>

    <ul id="expenseList"></ul>

    <h2 class="total">Total: ₹<span id="total">0</span></h2>

    <script>
        let total = 0;

function addExpense() {
    let name = document.getElementById("expenseName").value;
    let amount = Number(document.getElementById("expenseAmount").value);
    let category = document.getElementById("expenseCategory").value;

    if (name === "" || amount <= 0) {
        alert("Please enter a valid expense.");
        return;
    }

    let list = document.getElementById("expenseList");

    let item = document.createElement("li");

    item.innerHTML = `
        <strong>${name}</strong><br>
        ₹${amount} • ${category}
        <button onclick="deleteExpense(this, ${amount})">
            Delete
        </button>
    `;

    list.appendChild(item);

    total = total + amount;
    document.getElementById("total").textContent = total;

    document.getElementById("expenseName").value = "";
    document.getElementById("expenseAmount").value = "";
}

function deleteExpense(button, amount) {
    button.parentElement.remove();

    total = total - amount;
    document.getElementById("total").textContent = total;
}
    </script>

    </div>
</body>
</html>
